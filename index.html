<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jorge</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0a0a0a;
            color: #e0e0e0;
            font-family: 'JetBrains Mono', monospace;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            text-align: center;
            padding: 2rem;
            max-width: 600px;
        }

        .photo {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #222;
            margin-bottom: 1.5rem;
            filter: grayscale(10%);
            transition: filter 0.3s ease;
        }

        .photo:hover {
            filter: grayscale(0%);
        }

        .quote {
            font-size: 0.8rem;
            color: #555;
            font-weight: 300;
            line-height: 1.6;
            margin-bottom: 2rem;
            letter-spacing: 0.02em;
        }

        .quote .comment-open {
            color: #444;
        }

        .quote .comment-close {
            color: #444;
        }

        .quote .text {
            color: #777;
        }

        .quote .author {
            color: #666;
        }

        .info {
            font-size: 0.75rem;
            color: #444;
            letter-spacing: 0.15em;
            text-transform: lowercase;
            margin-bottom: 2rem;
        }

        .socials {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.2rem;
            margin-bottom: 2.5rem;
        }

        .socials a {
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.4;
            transition: opacity 0.3s ease;
        }

        .socials a:hover {
            opacity: 1;
        }

        .socials svg {
            width: 20px;
            height: 20px;
            fill: #fff;
        }

        .project-link {
            display: inline-block;
            font-size: 0.85rem;
            color: #e0e0e0;
            text-decoration: none;
            border: 1px solid #222;
            padding: 0.6rem 1.8rem;
            border-radius: 4px;
            letter-spacing: 0.1em;
            transition: all 0.3s ease;
        }

        .project-link:hover {
            border-color: #555;
            background-color: #111;
        }

        .project-label {
            font-size: 0.65rem;
            color: #333;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="me_kayak.jpg" alt="Jorge" class="photo">

        <div class="quote">

        </div>

        <div class="info">cs · physics · machine learning · sde at prime video</div>

        <div class="socials">

</html>
